services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/SpringEcom
      SPRING_DATASOURCE_USERNAME: Gabriel
      SPRING_DATASOURCE_PASSWORD: 123456
    depends_on:
      - mysql

  mysql:
    image: mysql:latest
    container_name: mysql_container
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: SpringEcom
      MYSQL_USER: Gabriel
      MYSQL_PASSWORD: 123456
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: